framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 2
                    max_delay: 300000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            'App\Message\UpdateVideoGamePrice': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
