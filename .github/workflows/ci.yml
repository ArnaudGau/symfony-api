name: Symfony CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      # On crée un .env minimal pour éviter que le runtime de Symfony ne plante
      - name: Create baseline .env
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=67d3a393e185088c4b6c31f6df2b8fbc" >> .env

       Tarifs
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint --test -v

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      # Même chose ici : création du fichier .env requis par Symfony
      - name: Prepare Symfony Env
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=67d3a393e185088c4b6c31f6df2b8fbc" >> .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Warmup Cache
        run: php bin/console cache:clear --env=test

      - name: Run tests
        run: ./vendor/bin/phpunit