name: Symfony CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        # --no-scripts bloque le cache:clear automatique ici
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint --test -v

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      # 1. On prépare l'environnement d'abord
      - name: Prepare Symfony Env
        run: |
          echo "APP_ENV=test" > .env.local
          echo "APP_SECRET=67d3a393e185088c4b6c31f6df2b8fbc" >> .env.local

      # 2. On installe (on peut garder --no-scripts pour aller plus vite)
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      # 3. Si tes tests ont besoin du cache reconstruit proprement :
      - name: Warmup Cache
        run: php bin/console cache:clear --env=test

      - name: Run tests
        run: ./vendor/bin/phpunit
