name: Symfony CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Ajout du -v pour voir le détail des erreurs si Pint échoue
      - name: Run Pint
        run: ./vendor/bin/pint --test -v

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Remplace le "Prepare Laravel" par la préparation de l'environnement Symfony
      - name: Prepare Symfony Env
        run: |
          echo "APP_ENV=test" > .env.dev

      # Commande de test standard pour Symfony (PHPUnit)
      - name: Run tests
        run: ./vendor/bin/phpunit
