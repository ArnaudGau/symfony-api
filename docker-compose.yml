services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_api_app
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:latest
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - symfony

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_api_worker
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --sleep=2
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:latest
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - symfony

  database:
    image: mysql:8
    container_name: symfony_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: symfony_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: symfony_api
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - symfony

  ollama:
    image: ollama/ollama:latest
    container_name: symfony_api_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - symfony

volumes:
  composer_cache:
  db_data:
  ollama_data:

networks:
  symfony:
